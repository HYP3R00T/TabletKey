name: 🐛 Bug Report
description: Report a reproducible issue or unexpected behavior in TabletKey.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Detailed bug reports help us fix issues faster.

        **Before submitting:**
        - Search existing issues to avoid duplicates
        - Verify the issue is reproducible with the latest version
        - Isolate the problem (provide minimal steps to reproduce)

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Linux distribution, version, and desktop session (Wayland or X11).
      placeholder: "Fedora 43, KDE Plasma, Wayland"
    validations:
      required: true

  - type: input
    id: installation_method
    attributes:
      label: Installation Method
      description: How did you set up TabletKey, and are commands running on the host or in a container?
      placeholder: "uv sync --locked, Linux host"
    validations:
      required: true

  - type: input
    id: environment_info
    attributes:
      label: Environment Details (Optional)
      description: Python version, relevant dependencies, or other environment details that might affect the issue.
      placeholder: "Python 3.12, VO1060, OpenTabletDriver version and running/stopped status"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, numbered steps to reproduce the issue. Be as specific as possible.
      placeholder: |
        1. Step 1
        2. Step 2
        3. Step 3
        4. Step 4
        5. Error occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead? Be clear and concise.
      placeholder: "tabletkey doctor should list the attached VO1060 interfaces."
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Describe the bug clearly and concisely.
      placeholder: "The application crashes with an Error"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Paste complete error logs, full stack traces, or screenshots. Use code blocks for readability.
      placeholder: |
        ```
        Put your log in here
        ```

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if available)
      description: If you've found a way to work around this issue, please describe it.
      placeholder: "Running on the Linux host instead of in a devcontainer changes the result."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Verification Checklist
      options:
        - label: I've verified this bug hasn't been reported before
          required: true
        - label: I can reproduce this issue consistently
          required: true
        - label: I've included all relevant logs, screenshots, and error messages
          required: true
        - label: I've tested with the latest version of the project
          required: false
