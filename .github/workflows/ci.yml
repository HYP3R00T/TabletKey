name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run prek checks
        uses: j178/prek-action@v2
        with:
          extra-args: --all-files --skip no-commit-to-branch

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          # QtGui links EGL/GL even when the offscreen platform is selected.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0
      - name: Install Python with build headers
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --locked --managed-python
      - name: Run hardware-independent tests
        run: uv run pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate package metadata and README
        run: uvx twine check --strict dist/*
      - name: Smoke-test the installed wheel entry point
        run: |
          wheel=$(realpath dist/*.whl)
          cd "$(mktemp -d)"
          uvx --from "$wheel" tabletkey --help
