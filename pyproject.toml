[project]
name = "tabletkey"
version = "0.1.0"
description = "Standalone VEIKK VO1060 driver for COSMIC/Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.8,<7", "evdev>=1.9,<2", "typer>=0.16,<1"]

[project.scripts]
tabletkey = "tabletkey.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "ty>=0.0.75,<0.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
