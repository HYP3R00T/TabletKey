[project]
name = "tabletkey"
version = "0.1.0"
description = "VEIKK VO1060 diagnostics and companion tooling for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
tabletkey = "tabletkey.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "ty>=0.0.75,<0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
